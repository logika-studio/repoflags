<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">repoflags</title>
  <desc id="d">Flags raised on the files of an unknown repository before you open it. repoflags by Logika.studio.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0F172A" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE4E6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#FAFAF7"/>
  <rect width="1280" height="360" rx="20" fill="url(#dots)"/>
  <circle cx="300" cy="180" r="260" fill="url(#glow)" clip-path="url(#clip)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="64" y="52" width="470" height="256" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M64 66a14 14 0 0 1 14-14h442a14 14 0 0 1 14 14v26H64z" fill="#F1F5F9"/>
    <circle cx="90" cy="72" r="5" fill="#CBD5E1"/>
    <circle cx="108" cy="72" r="5" fill="#CBD5E1"/>
    <circle cx="126" cy="72" r="5" fill="#CBD5E1"/>
    <text x="150" y="77" font-size="14" fill="#64748B">unknown-repo/  read as text</text>

    <g font-size="17" fill="#0F172A">
      <rect x="88" y="114" width="12" height="16" rx="2" fill="none" stroke="#94A3B8" stroke-width="2"/>
      <text x="114" y="128">package.json</text>
      <rect x="88" y="164" width="12" height="16" rx="2" fill="none" stroke="#94A3B8" stroke-width="2"/>
      <text x="114" y="178">.npmrc</text>
      <rect x="88" y="214" width="12" height="16" rx="2" fill="none" stroke="#94A3B8" stroke-width="2"/>
      <text x="114" y="228">tailwind.config.js</text>
      <rect x="88" y="264" width="12" height="16" rx="2" fill="none" stroke="#94A3B8" stroke-width="2"/>
      <text x="114" y="278">.vscode/tasks.json</text>
    </g>

    <g font-size="14" font-weight="700">
      <g transform="translate(400 108)">
        <path d="M0 0v26" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M1 1h18l-5 6 5 6H1z" fill="#64748B"/>
        <text x="28" y="18" fill="#64748B">info</text>
      </g>
      <g transform="translate(400 158)">
        <path d="M0 0v26" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M1 1h18l-5 6 5 6H1z" fill="#E11D48"/>
        <text x="28" y="18" fill="#E11D48">high</text>
      </g>
      <g transform="translate(400 208)">
        <path d="M0 0v26" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M1 1h18l-5 6 5 6H1z" fill="#D97706"/>
        <text x="28" y="18" fill="#D97706">medium</text>
      </g>
      <g transform="translate(400 258)">
        <path d="M0 0v26" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M1 1h18l-5 6 5 6H1z" fill="#E11D48"/>
        <text x="28" y="18" fill="#E11D48">high</text>
      </g>
    </g>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(600 98)">
      <path d="M0 0v52" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
      <path d="M2 2h34l-9 11 9 11H2z" fill="#E11D48"/>
    </g>
    <text x="652" y="148" font-size="72" font-weight="800" letter-spacing="-2" fill="#0F172A">repo<tspan fill="#E11D48">flags</tspan></text>
    <text x="602" y="206" font-size="26" fill="#334155">Check an unknown repository</text>
    <text x="602" y="240" font-size="26" fill="#334155">before you open, install or run it.</text>
    <text x="602" y="292" font-size="17" fill="#64748B" letter-spacing="0.5">static check  ·  nothing from the repo is executed  ·  MIT</text>
    <text x="1216" y="330" font-size="15" fill="#94A3B8" text-anchor="end">by Logika.studio</text>
  </g>
</svg>
