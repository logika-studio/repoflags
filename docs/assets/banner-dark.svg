<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">repoflags</title>
  <desc id="d">Flags raised on the files of an unknown repository before you open it. repoflags by Logika.studio.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B0D18" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#0D1117"/>
  <rect width="1280" height="360" rx="20" fill="url(#dots)"/>
  <circle cx="300" cy="180" r="260" fill="url(#glow)" clip-path="url(#clip)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="64" y="52" width="470" height="256" rx="14" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <path d="M64 66a14 14 0 0 1 14-14h442a14 14 0 0 1 14 14v26H64z" fill="#1F2630"/>
    <circle cx="90" cy="72" r="5" fill="#484F58"/>
    <circle cx="108" cy="72" r="5" fill="#484F58"/>
    <circle cx="126" cy="72" r="5" fill="#484F58"/>
    <text x="150" y="77" font-size="14" fill="#8B949E">unknown-repo/  read as text</text>

    <g font-size="17" fill="#E6EDF3">
      <rect x="88" y="114" width="12" height="16" rx="2" fill="none" stroke="#6E7681" stroke-width="2"/>
      <text x="114" y="128">package.json</text>
      <rect x="88" y="164" width="12" height="16" rx="2" fill="none" stroke="#6E7681" stroke-width="2"/>
      <text x="114" y="178">.npmrc</text>
      <rect x="88" y="214" width="12" height="16" rx="2" fill="none" stroke="#6E7681" stroke-width="2"/>
      <text x="114" y="228">tailwind.config.js</text>
      <rect x="88" y="264" width="12" height="16" rx="2" fill="none" stroke="#6E7681" stroke-width="2"/>
      <text x="114" y="278">.vscode/tasks.json</text>
    </g>

    <g font-size="14" font-weight="700">
      <g transform="translate(400 108)">
        <path d="M0 0v26" stroke="#8B949E" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M1 1h18l-5 6 5 6H1z" fill="#8B949E"/>
        <text x="28" y="18" fill="#8B949E">info</text>
      </g>
      <g transform="translate(400 158)">
        <path d="M0 0v26" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M1 1h18l-5 6 5 6H1z" fill="#FB7185"/>
        <text x="28" y="18" fill="#FB7185">high</text>
      </g>
      <g transform="translate(400 208)">
        <path d="M0 0v26" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M1 1h18l-5 6 5 6H1z" fill="#FBBF24"/>
        <text x="28" y="18" fill="#FBBF24">medium</text>
      </g>
      <g transform="translate(400 258)">
        <path d="M0 0v26" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M1 1h18l-5 6 5 6H1z" fill="#FB7185"/>
        <text x="28" y="18" fill="#FB7185">high</text>
      </g>
    </g>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(600 98)">
      <path d="M0 0v52" stroke="#E6EDF3" stroke-width="5" stroke-linecap="round"/>
      <path d="M2 2h34l-9 11 9 11H2z" fill="#FB7185"/>
    </g>
    <text x="652" y="148" font-size="72" font-weight="800" letter-spacing="-2" fill="#E6EDF3">repo<tspan fill="#FB7185">flags</tspan></text>
    <text x="602" y="206" font-size="26" fill="#C9D1D9">Check an unknown repository</text>
    <text x="602" y="240" font-size="26" fill="#C9D1D9">before you open, install or run it.</text>
    <text x="602" y="292" font-size="17" fill="#8B949E" letter-spacing="0.5">static check  ·  nothing from the repo is executed  ·  MIT</text>
    <text x="1216" y="330" font-size="15" fill="#6E7681" text-anchor="end">by Logika.studio</text>
  </g>
</svg>
